name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы выложить APK на страницу Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Тесты ядра (не блокируют сборку)
        continue-on-error: true
        run: node tests/test-core.js

      - name: Сборка debug-APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: Scrobbler-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Публикация APK на странице Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Scrobbler.apk
          gh release create "build-${{ github.run_number }}" Scrobbler.apk \
            --title "Scrobbler, сборка ${{ github.run_number }}" \
            --notes "Готовый APK: нажмите Scrobbler.apk, откройте скачанный файл на телефоне и установите." \
            --target "${{ github.sha }}" \
            --latest
